<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif">
  <defs><marker id="dm" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#2a2823" stroke-width="1.4"/></marker></defs>
  <rect width="760" height="330" fill="#fbf9f4"/>
  <text x="20" y="26" font-size="13" font-weight="600" fill="#2a2823" letter-spacing="1">TOP VIEW · placing the block</text>
  <!-- rails -->
  <line x1="45" y1="40" x2="45" y2="290" stroke="#cfc9bd" stroke-width="8"/>
  <line x1="715" y1="40" x2="715" y2="290" stroke="#cfc9bd" stroke-width="8"/>
  <!-- table -->
  <rect x="80" y="50" width="600" height="240" fill="#e9e4d8" stroke="#2a2823"/>
  <line x1="80" y1="290" x2="680" y2="290" stroke="#b85a2c" stroke-width="3"/>
  <text x="380" y="314" font-size="12" font-weight="600" fill="#b85a2c" text-anchor="middle">front edge of the table · operator side · zero is here</text>
  <!-- centre mark -->
  <line x1="380" y1="50" x2="380" y2="290" stroke="#2a2823" stroke-dasharray="4 5"/>
  <path d="M372 290 L 380 278 L 388 290 Z" fill="#2a2823"/>
  <text x="388" y="66" font-size="11" fill="#5c574d">table centre mark</text>
  <!-- block -->
  <rect x="230" y="100" width="300" height="190" fill="#f3e6c8" stroke="#2a2823" stroke-width="1.6"/>
  <!-- part -->
  <rect x="255" y="145" width="250" height="100" fill="#e6e3dc" stroke="#8d8c86"/>
  <text x="380" y="200" font-size="12" font-weight="600" fill="#2a2823" text-anchor="middle">part</text>
  <!-- margins -->
  <g font-size="11" fill="#2a2823">
    <line x1="230" y1="130" x2="255" y2="130" stroke="#2a2823" marker-start="url(#dm)" marker-end="url(#dm)"/>
    <text x="214" y="134" text-anchor="end">≈ 25 mm each side</text>
    <line x1="505" y1="130" x2="530" y2="130" stroke="#2a2823" marker-start="url(#dm)" marker-end="url(#dm)"/>
    <text x="546" y="142">≈ 25 mm</text>
    <line x1="490" y1="245" x2="490" y2="290" stroke="#2a2823" marker-start="url(#dm)" marker-end="url(#dm)"/>
    <text x="546" y="272">≈ 75 mm front</text>
    <line x1="490" y1="100" x2="490" y2="145" stroke="#2a2823" marker-start="url(#dm)" marker-end="url(#dm)"/>
    <text x="546" y="112">≈ 75 mm back</text>
  </g>
  <text x="150" y="190" font-size="11" fill="#5c574d" text-anchor="middle">half-width</text>
  <text x="150" y="204" font-size="11" fill="#5c574d" text-anchor="middle">mark on the</text>
  <text x="150" y="218" font-size="11" fill="#5c574d" text-anchor="middle">block lines up</text>
  <text x="150" y="232" font-size="11" fill="#5c574d" text-anchor="middle">with the centre</text>
  <text x="604" y="200" font-size="11" fill="#5c574d" text-anchor="middle">block squared</text>
  <text x="604" y="214" font-size="11" fill="#5c574d" text-anchor="middle">to the front edge</text>
</svg>
