<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif">
  <rect width="760" height="330" fill="#fbf9f4"/>
  <text x="20" y="26" font-size="13" font-weight="600" fill="#2a2823" letter-spacing="1">TOP VIEW · tapered part</text>
  <text x="380" y="40" font-size="11" fill="#5c574d" text-anchor="middle">↑ back of machine</text>
  <text x="380" y="318" font-size="11" fill="#5c574d" text-anchor="middle">↓ front (operator)</text>
  <!-- tower rails -->
  <line x1="60" y1="40" x2="60" y2="300" stroke="#cfc9bd" stroke-width="8"/>
  <line x1="700" y1="40" x2="700" y2="300" stroke="#cfc9bd" stroke-width="8"/>
  <text x="60" y="318" font-size="12" font-weight="600" fill="#2a2823" text-anchor="middle">LEFT TOWER · X</text>
  <text x="640" y="318" font-size="12" font-weight="600" fill="#2a2823" text-anchor="middle">RIGHT TOWER · A</text>
  <!-- part between faces (planform) -->
  <path d="M230 80 L 530 120 L 530 220 L 230 260 Z" fill="#e6e3dc" stroke="#8d8c86"/>
  <line x1="230" y1="80" x2="230" y2="260" stroke="#1f6fb2" stroke-width="3"/>
  <line x1="530" y1="120" x2="530" y2="220" stroke="#d9480f" stroke-width="3"/>
  <text x="222" y="170" font-size="12" fill="#1f6fb2" text-anchor="end" font-weight="600">root face</text>
  <text x="222" y="185" font-size="11" fill="#5c574d" text-anchor="end">300 mm chord</text>
  <text x="538" y="170" font-size="12" fill="#d9480f" font-weight="600">tip face</text>
  <text x="538" y="185" font-size="11" fill="#5c574d">200 mm</text>
  <!-- wire lines through matching points, extended to towers -->
  <g stroke="#b85a2c" stroke-width="1.6">
    <line x1="60" y1="57.3" x2="700" y2="142.7" stroke-dasharray="6 4"/>
    <line x1="60" y1="282.7" x2="700" y2="197.3" stroke-dasharray="6 4"/>
  </g>
  <g fill="#b85a2c"><circle cx="230" cy="80" r="4"/><circle cx="530" cy="120" r="4"/><circle cx="230" cy="260" r="4"/><circle cx="530" cy="220" r="4"/></g>
  <text x="380" y="88" font-size="11" fill="#b85a2c" text-anchor="middle">wire at the leading edge</text>
  <text x="380" y="262" font-size="11" fill="#b85a2c" text-anchor="middle">wire at the trailing edge</text>
  <!-- tower travel -->
  <line x1="60" y1="57.3" x2="60" y2="282.7" stroke="#2a2823" stroke-width="4"/>
  <line x1="700" y1="142.7" x2="700" y2="197.3" stroke="#2a2823" stroke-width="4"/>
  <g font-size="11" fill="#2a2823">
    <text x="72" y="160" font-weight="600">tower moves</text><text x="72" y="174" font-weight="600">226 mm</text>
    <text x="72" y="190" fill="#5c574d">more than</text><text x="72" y="203" fill="#5c574d">the root</text>
    <text x="688" y="236" text-anchor="end" font-weight="600">tower moves 54 mm</text>
    <text x="688" y="250" text-anchor="end" fill="#5c574d">less than the tip</text>
  </g>
</svg>
